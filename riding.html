<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12342a">
<title>北京骑行路线集</title>
<meta name="description" content="北京骑友爬坡路线汇总：戒台寺、妙峰山、潭王路、小老鼠、大杨山、红井路、黑峪口等经典路线。">
<style>
:root{--g:#1f4d3a;--g2:#2f6b50;--tx:#12281f;--mu:#3f5249;--glass:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.38))}
*{box-sizing:border-box;margin:0}
body{font:16px/1.65 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--tx);-webkit-text-size-adjust:100%;min-height:100vh;background:#dfe5e2;padding:max(14px,env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70% 38% at 12% 6%,rgba(86,170,128,.75),transparent 70%),radial-gradient(60% 36% at 95% 24%,rgba(158,208,180,.7),transparent 70%),radial-gradient(70% 40% at 20% 78%,rgba(63,143,106,.4),transparent 70%),linear-gradient(170deg,#12342a 0%,#1f4d3a 30%,#7fa392 62%,#d9dfdc 100%)}
header,.card,footer{max-width:680px;margin:0 auto 14px;border:1px solid rgba(255,255,255,.5);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.12),0 10px 30px rgba(7,30,21,.25)}
header{border-radius:28px;background:linear-gradient(135deg,rgba(31,77,58,.78),rgba(31,77,58,.5));color:#fff;text-align:center;padding:30px 20px 26px}
.card,footer{background:var(--glass);border-radius:22px}
h1{font-size:30px;letter-spacing:.12em;font-weight:800}
header p{margin-top:6px;font-size:15px;color:rgba(255,255,255,.88);letter-spacing:.08em}
.team{display:inline-block;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.62));color:var(--g);font-weight:800;font-size:28px;line-height:1.4;letter-spacing:.1em;padding:4px 22px;border-radius:99px;margin-bottom:14px;box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(0,0,0,.2)}
.strava{display:inline-block;margin-top:14px;color:#fff;background:linear-gradient(180deg,#f2570f,#d93d00);text-decoration:none;font-weight:700;font-size:15px;padding:8px 22px;border-radius:99px;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(217,61,0,.4)}
.strava:active{background:#b83900}
main{max-width:680px;margin:0 auto}
.card{position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.28),transparent 38%)}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:block;transition:transform .15s}
summary::-webkit-details-marker{display:none}
summary:active{transform:scale(.985)}
summary:focus-visible,.btn:focus-visible,.strava:focus-visible{outline:3px solid var(--g2);outline-offset:-3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:20px;font-weight:700}
.lv{font-size:13px;font-weight:600;padding:3px 11px;border-radius:99px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);color:var(--g);white-space:nowrap}
.lv::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dc);margin-right:6px}
.d1{--dc:#7bc59a}.d2{--dc:#3f9a6c}.d3{--dc:#23744f}.d4{--dc:#0f3a26}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;margin:8px 0 4px}
.stats b{display:block;font-size:19px;color:var(--g);line-height:1.3}
.stats span{font-size:12px;color:var(--mu)}
.intro{font-size:14px;color:var(--mu)}
.more{font-size:13px;font-weight:600;color:var(--g2);margin-top:8px}
.more::after{content:"展开详情 ▾"}
details[open] .more::after{content:"收起 ▴"}
.body{padding:2px 18px 18px;border-top:1px solid rgba(31,77,58,.15);animation:o .25s ease-out}
@keyframes o{from{opacity:0;transform:translateY(-6px)}}
dl{margin:10px 0 14px}
dt{font-size:13px;font-weight:700;color:var(--g);margin-top:10px}
dd{font-size:15px}
.risk{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:8px 12px;margin-top:2px}
.btn{display:block;text-align:center;color:#fff;background:linear-gradient(180deg,#2f6b50,#1f4d3a);text-decoration:none;font-weight:700;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px rgba(8,32,22,.3)}
.btn:active{filter:brightness(.9)}
footer{margin-bottom:0;padding:16px 18px;font-size:13px;line-height:1.7;color:var(--mu)}
footer strong{color:var(--g)}
@media (prefers-reduced-motion:reduce){.body{animation:none}summary{transition:none}}
@media (prefers-reduced-transparency:reduce){header{background:var(--g)}.card,footer{background:#f4f6f5;-webkit-backdrop-filter:none;backdrop-filter:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header{background:var(--g)}.card,footer{background:rgba(255,255,255,.92)}}
</style>
</head>
<body>
<header>
  <div class="team">D2车队</div>
  <h1>北京骑行路线集</h1>
  <p>北京骑友爬坡路线汇总</p>
  <a class="strava" href="https://www.strava.com" target="_blank" rel="noopener">前往 Strava ↗</a>
</header>
<main id="list"></main>
<footer><strong>安全提示：</strong>路线里程、爬升为骑友路书参考值，仅供参考；骑行务必佩戴头盔，注意观察大车弯道，遵守交通法规，量力而行。</footer>
<script>
const R=[
{n:"戒台寺",km:"4.7km（单程）",up:"213m",g:"约4.5%",lv:"中级",d:2,intro:"弯道密集的京西入门爬坡，适合练爬升节奏。",
 s:"戒台寺牌楼",e:"戒台寺",t:"上行约30–50分钟",r:"以柏油路为主，弯道多，坡度有起伏。",
 u:"戒台寺停车场（补给点）",k:"弯道密集，下坡注意控速；节假日游客车多，留意横穿行人和大巴。",q:"戒台寺牌楼"},
{n:"妙峰山",km:"19.7km（单程）",up:"871m",g:"约4.4%",lv:"硬核",d:4,intro:"长距离持续爬坡，北京最经典的硬核爬坡之一。",
 s:"涧沟村牌楼",e:"妙峰山景区山顶",t:"上行约2–3小时，往返约4–5小时",r:"柏油路，持续爬坡，后半段坡度和海拔感明显。",
 u:"路线较长，出发前备足水和能量补给，沿途补给点有限。",k:"后半段大车较多，弯道注意观察；下山路长，注意控速和刹车发热；山上温差大，备风衣。",q:"涧沟村牌楼"},
{n:"潭王路",km:"26km（单程）",up:"约520–560m",lv:"中级",d:2,intro:"路面平整的京西经典线，沿途农家院和咖啡好补给。",
 s:"潭柘寺南辛房村",e:"王平方向",t:"单程约1.5–2小时",r:"路面整体平整，适合稳定节奏骑行。",
 u:"沿途有农家院、咖啡店可补给。",k:"路段有车辆往来，注意弯道和大车；半途补给点需提前规划。",q:"南辛房村"},
{n:"小老鼠",km:"68km",up:"约950m",lv:"进阶",d:3,intro:"京西小老鼠环线，串联戒台寺与潭王路的经典环线。",
 s:"首钢大桥",e:"首钢大桥（环线）",t:"约4.5–6小时",r:"起伏路加两段爬坡，路况以柏油为主。",
 u:"潭柘寺环岛、紫旸山庄、王平。",k:"全程较长，注意体能分配；部分路段车流大，爬坡和下坡都要控速。",q:"首钢大桥"},
{n:"大杨山环线",km:"主爬坡约14.4km；完整环线约40–100km",up:"主爬坡约285m",lv:"中级偏休闲",d:2,intro:"林荫多、坡度平缓，适合轻松骑行。",
 s:"大杨山森林公园门口（静之湖/兴寿方向）",e:"可原路返回，或按需绕环线",t:"视绕法，约2–5小时",r:"林荫路多、坡度平缓，部分乡道路面破损。",
 u:"百合村可补水补给。",k:"乡道破损处注意坑洼和落叶；环线路线灵活，出发前确认绕法和补给。",q:"大杨山森林公园"},
{n:"天线小老鼠",km:"115km",up:"1900m",lv:"硬核",d:4,intro:"戒台寺、潭王路、妙峰山三连爬，强度很大。",
 s:"首钢大桥",e:"首钢大桥（环线）",t:"约7–10小时",r:"在小老鼠基础上向北延伸妙峰山，路况多变。",
 u:"需带足补给；可参考小老鼠沿线补给点。",k:"距离长、爬升大，务必量力而行；妙峰山段大车多，注意体能和日落时间。",q:"首钢大桥"},
{n:"红井路",km:"约19km（单程）",up:"约650m",lv:"中级",d:2,intro:"连续发卡弯，节奏感强，但弯道视野差。",
 s:"红井路口",e:"红井路山顶方向",t:"上行约1.5–2.5小时",r:"柏油路，连续发卡弯，坡度变化较多。",
 u:"补给点较少，出发前备好水和补给。",k:"弯道视野差，注意对向车辆，下坡严格控速，不要压线。",q:"红井路"},
{n:"黑峪口",km:"爬坡段约5km",up:"约300m",lv:"入门到中级",d:1,intro:"昌赤路·燕山天池坡，坡度先紧后缓，垭口可远眺水库。",
 s:"黑峪口村路口",e:"垭口，可放坡至白河堡水库（燕山天池）",t:"上行约30–50分钟",r:"正规公路，路况较好。",
 u:"路程短，自备水即可；可前往白河堡水库休息补给。",k:"前段坡度较陡，起步控制节奏；放坡时注意车辆和弯道。",q:"黑峪口村"},
{n:"老山环线",km:"3.9km（每圈）",up:"41m（每圈）",lv:"低级",d:1,intro:"休闲新手路线，每圈短、爬升小，适合热身和练习骑行。",
 t:"每圈约15–25分钟，可按体力多骑几圈",k:"新手请控制速度，注意让行行人和其他骑行者；量力增加圈数。",q:"老山环线"}
];
const LS=document.getElementById("list");
const f=(t,v,c)=>v?`<dt>${t}</dt><dd${c?` class="${c}"`:""}>${v}</dd>`:"";
LS.innerHTML=R.map(x=>`<details class="card d${x.d}"><summary>
<div class="top"><span class="name">${x.n}</span><span class="lv">${x.lv}</span></div>
<div class="stats"><div><b>${x.km}</b><span>总里程</span></div><div><b>${x.up}</b><span>累计爬升</span></div>${x.g?`<div><b>${x.g}</b><span>平均坡度</span></div>`:""}</div>
<p class="intro">${x.intro}</p><p class="more"></p></summary>
<div class="body"><dl>
${f("起点位置",x.s)}${f("终点位置",x.e)}${f("预计骑行时长",x.t)}${f("路面情况",x.r)}${f("沿途补给点位",x.u)}${f("骑行风险和注意事项",x.k,"risk")}</dl>
<a class="btn" target="_blank" rel="noopener" href="https://uri.amap.com/search?keyword=${encodeURIComponent(x.q)}&city=%E5%8C%97%E4%BA%AC">高德地图导航到起点</a></div></details>`).join("");
LS.addEventListener("toggle",e=>{if(e.target.open)LS.querySelectorAll("details[open]").forEach(d=>{if(d!==e.target)d.open=false})},true);
</script>
</body>
</html>
